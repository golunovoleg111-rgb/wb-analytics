name: Runtime integrity

on:
  pull_request:
  push:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax, imports and assets
        run: node scripts/validate-runtime.mjs
      - name: Check MutationObserver safety
        run: node scripts/check-mutation-observers.mjs
