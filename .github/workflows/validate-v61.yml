name: BELTANEE v6.1 validation

on:
  push:
    branches: [feature/new-architecture]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Check critical architecture files
        shell: bash
        run: |
          set -euo pipefail
          test -f src/infrastructure/db.js
          test -f src/services/ImportService.js
          test -f src/services/DataIntegrityService.js
          test -f src/core/sales/SalesRecord.js
          test -f src/core/stock/StockRecord.js
