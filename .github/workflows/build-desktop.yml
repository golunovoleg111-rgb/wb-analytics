name: Build B-JOB Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'src/**'
      - 'favicon.svg'
      - 'sw.js'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: B-JOB-Windows
          path: desktop/dist/*.exe
