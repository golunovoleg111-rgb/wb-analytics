<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B-JOB</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#f5f6f8}
    body{display:flex;align-items:center;justify-content:center}
    .card{max-width:620px;padding:40px;border-radius:18px;background:white;box-shadow:0 12px 40px rgba(0,0,0,.08)}
    h1{margin-top:0}.status{padding:12px;border-radius:10px;background:#f0f2f5}
  </style>
</head>
<body>
  <main class="card">
    <h1>B-JOB</h1>
    <p>Локальное приложение запущено.</p>
    <div class="status" id="status">Инициализация локального хранилища…</div>
  </main>
  <script>
    const status = document.getElementById('status');
    window.BJobDesktop.getInfo().then(info => {
      status.textContent = `Локальный режим готов. Версия ${info.version}`;
    }).catch(() => {
      status.textContent = 'Локальный режим готов.';
    });
  </script>
</body>
</html>
