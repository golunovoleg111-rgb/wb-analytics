<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>B-JOB</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./src/bjob/single.css?v=87">
<link rel="stylesheet" href="./src/bjob/assembly.css?v=87">
<link rel="stylesheet" href="./src/bjob/fbsWarehouse.css?v=87">
<link rel="stylesheet" href="./src/bjob/modalFix.css?v=87">
<link rel="stylesheet" href="./src/bjob/fbsFixesV85.css?v=87">
</head>
<body>
<div id="app"><div id="boot-status" style="min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#edf2f7;font:600 14px system-ui">B-JOB загружается…</div></div>
<script>
(()=>{const started=Date.now();const show=(title,message)=>{const app=document.querySelector('#app');if(app)app.innerHTML=`<div class="single-fatal"><h1>${title}</h1><p>${message}</p><small>Boot diagnostics: ${Date.now()-started} ms</small><br><button class="ui-btn primary" onclick="location.reload()">Повторить</button></div>`};window.addEventListener('error',e=>show('B-JOB — ошибка запуска',String(e.error?.message||e.message||'Неизвестная ошибка')),{capture:true});window.addEventListener('unhandledrejection',e=>show('B-JOB — ошибка запуска',String(e.reason?.message||e.reason||'Необработанная ошибка')));setTimeout(()=>{const el=document.querySelector('#boot-status');if(el&&el.textContent.includes('B-JOB загружается'))show('B-JOB — запуск завис','Основной JavaScript не завершил загрузку за 12 секунд.')},12000)})();
</script>
<script src="./src/bjob/bootRecovery.js?v=87"></script>
<script>
(async()=>{const app=document.querySelector('#app');try{const core=await import('./src/bjob/singleBoot.js?v=87');if(!core)throw new Error('singleBoot.js не загрузился')}catch(error){console.error('B-JOB core module failed',error);sessionStorage.setItem('bjob:safe-mode','1');app.innerHTML=`<div class="single-fatal"><h1>B-JOB не запущен</h1><p>Не удалось загрузить основной модуль приложения.</p><small>${String(error?.message||error)}</small></div>`}})();
window.addEventListener('bjob:ready',async()=>{if(sessionStorage.getItem('bjob:safe-mode')==='1')return;for(const [url,name] of [['./src/bjob/assembly.js?v=87','startAssemblyLayer'],['./src/bjob/lifecycleEnhancements.js?v=87','installLifecycleEnhancements'],['./src/bjob/assemblyInventoryGuard.js?v=87','installAssemblyInventoryGuard'],['./src/bjob/fbsLocalMirror.js?v=87','installFbsLocalMirror'],['./src/bjob/transferViewEnhancement.js?v=87','installTransferViewEnhancement'],['./src/bjob/fbsFixesV83.js?v=87','installFbsFixesV83'],['./src/bjob/managementFixV83.js?v=87','installManagementFixV83']]){try{const m=await import(url);if(typeof m[name]!=='function')throw new Error(`${name} не экспортирован`);await m[name]()}catch(e){console.error(`Optional module failed: ${url}`,e)}}},{once:true});
</script>
</body>
</html>
