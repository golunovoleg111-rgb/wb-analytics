<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELTANEE v5.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-logo" id="sidebarLogo">
            <span class="logo-icon">B</span>
            <span class="logo-text">BELTANEE</span>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item active" data-page="dashboard">
                <span class="menu-icon">🏠</span>
                <span class="menu-label">Главная</span>
            </li>
            <li class="menu-item" data-page="products">
                <span class="menu-icon">📦</span>
                <span class="menu-label">Товары</span>
            </li>
            <li class="menu-item" data-page="settings">
                <span class="menu-icon">⚙️</span>
                <span class="menu-label">Настройки</span>
            </li>
        </ul>
        <div class="sidebar-version">BELTANEE v5.0.0 (Alpha)</div>
    </nav>

    <main class="content">
        <!-- ГЛАВНАЯ -->
        <section id="page-dashboard" class="page active">
            <div class="page-header">
                <h1>📊 Главная</h1>
            </div>
            <div class="placeholder-text">Нет данных. Загрузите отчёты WB через импорт.</div>
        </section>

        <!-- ТОВАРЫ -->
        <section id="page-products" class="page">
            <div class="page-header">
                <h1>📦 Товары</h1>
            </div>
            <div class="placeholder-text">Нет данных. Загрузите отчёты WB через импорт.</div>
        </section>

        <!-- НАСТРОЙКИ -->
        <section id="page-settings" class="page">
            <div class="page-header">
                <h1>⚙️ Настройки</h1>
            </div>

            <!-- Диагностика базы данных -->
            <div class="card" style="margin-bottom: 14px;">
                <div class="card-title">Состояние системы</div>
                <div id="dbStatus">Проверка базы данных...</div>
            </div>

            <!-- Тарифы WB -->
            <div class="card">
                <div class="card-title">📦 Тарифы Wildberries</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Комиссия FBO (%)
                        </label>
                        <input type="number" id="fboCommission" value="15" min="1" max="50" step="1" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Комиссия FBS (%)
                        </label>
                        <input type="number" id="fbsCommission" value="10" min="1" max="50" step="1" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Ставка хранения базовая (₽/литр/день)
                        </label>
                        <input type="number" id="storageBaseRate" value="0.07" min="0.01" max="1" step="0.01" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Ставка хранения повышенная (₽/литр/день)
                        </label>
                        <input type="number" id="storageOverRate" value="0.15" min="0.01" max="1" step="0.01" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Объём единицы товара (литров)
                        </label>
                        <input type="number" id="volumePerUnit" value="5" min="0.5" max="100" step="0.5" style="width: 100%;">
                    </div>
                </div>
            </div>

            <!-- Налоги -->
            <div class="card">
                <div class="card-title">🧾 Налоги</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Система налогообложения
                        </label>
                        <select id="taxSystem" style="width: 100%;">
                            <option value="usn6">УСН 6% (доходы)</option>
                            <option value="usn15">УСН 15% (доходы − расходы)</option>
                            <option value="patent">Патент</option>
                        </select>
                    </div>
                    <div id="patentBlock" style="display: none;">
                        <label style="font-size: 11px; font-weight: 500; display: block; margin-bottom: 3px;">
                            Стоимость патента в год (₽)
                        </label>
                        <input type="number" id="patentCost" value="30000" min="1000" max="10000000" step="1000" style="width: 100%;">
                    </div>
                </div>
            </div>

            <!-- Кнопка сохранения -->
            <button class="btn btn-primary" id="saveSettingsBtn" style="width: 100%; padding: 10px; font-size: 14px;">
                💾 Сохранить настройки
            </button>
            <div id="saveStatus" style="text-align: center; margin-top: 8px; font-size: 12px;"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
